titolo: Laboratorio di ecologia forestale ad Ancona
sottotitolo: Leggiamo gli anelli degli alberi e rileviamo i boschi con droni LiDAR e satelliti, per capire come le foreste di montagna rispondono a gelate, siccità e incendi.
