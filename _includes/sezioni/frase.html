{%- assign sez = include.sez -%}{%- capture p -%}pagina.sezioni.{{ include.i }}{%- endcapture -%}
  <section class="section statement" id="{{ sez.id }}" data-moment="word-highlight" style="{{ include.stile }}" data-sezione="{{ include.i }}" aria-label="{{ sez.etichetta }}">
    <div class="wrap">
      <p class="t-label" data-edit="{{ p }}.etichetta">{{ sez.etichetta }}</p>
      <p class="mo-wh__text" data-edit="{{ p }}.testo" data-rich>{{ sez.testo | markdownify | remove: "<p>" | remove: "</p>" | strip }}</p>
    </div>
  </section>
