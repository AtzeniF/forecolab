{%- assign sez = include.sez -%}{%- capture p -%}pagina.sezioni.{{ include.i }}{%- endcapture -%}
  <section class="section section--testo{% if sez.fondo == 'scuro' %} ground-inverse{% endif %}" id="{{ sez.id }}" style="{{ include.stile }}" data-sezione="{{ include.i }}" aria-labelledby="{{ sez.id }}-h">
    <div class="wrap">
      <h2 id="{{ sez.id }}-h" data-edit="{{ p }}.titolo">{{ sez.titolo }}</h2>
      <div class="tx__body" data-edit="{{ p }}.testo" data-rich data-multiline>{{ sez.testo | markdownify }}</div>
    </div>
  </section>
