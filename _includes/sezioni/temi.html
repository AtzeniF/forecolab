{%- assign sez = include.sez -%}{%- capture p -%}pagina.sezioni.{{ include.i }}{%- endcapture -%}
  <section class="section" id="{{ sez.id }}" style="--hm: 2" data-sezione="{{ include.i }}" aria-labelledby="{{ sez.id }}-h">
    <div class="wrap">
      <div class="section-head"><h2 id="{{ sez.id }}-h" data-edit="{{ p }}.titolo">{{ sez.titolo }}</h2><p data-edit="{{ p }}.testo">{{ sez.testo }}</p></div>
      <div class="grid grid--top fill" data-peek>
        <ul class="rows span-6">
          {%- for t in site.data.temi %}
          <li data-peek-to="tema-{{ forloop.index }}" tabindex="0" data-list="temi" data-index="{{ forloop.index0 }}"><span class="rows__name" data-edit="temi.{{ forloop.index0 }}.titolo">{{ t.titolo }}</span><p data-edit="temi.{{ forloop.index0 }}.testo">{{ t.testo }}</p></li>
          {%- endfor %}
        </ul>
        <div class="frame frame--photo frame--fill span-6 start-7">
          {%- for t in site.data.temi %}
          <img class="frame__img" data-peek-for="tema-{{ forloop.index }}" src="{{ t.foto | relative_url }}" alt="{{ t.alt }}" loading="lazy" data-edit-img="temi.{{ forloop.index0 }}"{% unless forloop.first %} hidden{% endunless %}>
          {%- endfor %}
        </div>
      </div>
    </div>
  </section>
