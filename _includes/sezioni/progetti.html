{%- assign sez = include.sez -%}{%- capture p -%}pagina.sezioni.{{ include.i }}{%- endcapture -%}
  <section class="section" id="{{ sez.id }}" data-sezione="{{ include.i }}" aria-labelledby="{{ sez.id }}-h">
    <div class="wrap">
      {%- assign progetti = site.progetti | sort: "ordine" %}
      <div class="section-head"><h2 id="{{ sez.id }}-h" data-edit="{{ p }}.titolo">{{ sez.titolo }}</h2><p data-edit="{{ p }}.testo">{{ sez.testo }}</p></div>
      <div class="grid grid--top projects">
        {%- for x in progetti %}
        <a class="proj span-4" href="{{ x.url | relative_url }}"><span class="proj__pic m-zoom"><img src="{{ x.foto | relative_url }}" alt="{{ x.foto_alt }}" loading="lazy"></span><span class="proj__fund">{{ x.fondo }}</span><span class="proj__name">{{ x.nome }}</span></a>
        {%- endfor %}
      </div>
    </div>
  </section>
