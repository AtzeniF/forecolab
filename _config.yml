title: ForEcoLab
lang: it
url: https://atzenif.github.io
baseurl: /forecolab
# GitHub Pages compila il sito con Jekyll. I testi stanno in _data/, le foto in assets/img/.
exclude:
  - team.md
  - shots
  - README.md
# Ogni progetto è un file in _progetti/ e ha la sua pagina: /progetti/<nome-del-file>/
collections:
  progetti:
    output: true
    permalink: /progetti/:name/
defaults:
  - scope: { path: "", type: progetti }
    values: { layout: progetto }
